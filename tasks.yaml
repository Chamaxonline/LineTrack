# foreman task queue. Tasks run highest priority first.
# Each task becomes a branch foreman/<id> and a pull request.
tasks:
  - id: list-tenants-endpoint
    title: Add a GET /tenants endpoint
    description: |
      Add a GET /tenants endpoint to apps/api that returns every Tenant row
      from the database (id, name, createdAt, updatedAt), ordered by name
      ascending. Use the existing Prisma Tenant model; no new migration
      should be needed. Document the response shape in Swagger the same way
      the existing /health endpoint does.
    acceptance:
      - GET /tenants returns 200 with a JSON array of tenants
      - Each item includes id, name, createdAt, updatedAt
      - Results are ordered by name ascending
      - Covered by a test that seeds at least one tenant and asserts the response
      - Documented in Swagger (visible at /docs)
    priority: high
    # model: opus            # optional coder model override
    # files: [apps/api/src]  # optional hint: where to look first

  # A task can also be given as just a free-text ask, with no title or
  # acceptance list written out. With `docs.enabled: true` in
  # foreman.config.yaml, foreman turns this into a story doc under
  # docs.dir before planning (or reconciles it against one that's already
  # there), and plans and codes from that doc.
  # - id: faster-login
  #   prompt: The login page feels slow on mobile. Make it noticeably faster.
